name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Render skip phrases must also stop the independent Pages publisher.
    # Gate the whole job, before environment access, artifact upload or deploy.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !github.event.deleted &&
          github.event.head_commit.message &&
          !contains(github.event.head_commit.message, '[skip render]') &&
          !contains(github.event.head_commit.message, '[render skip]') &&
          !contains(github.event.head_commit.message, '[skip deploy]') &&
          !contains(github.event.head_commit.message, '[deploy skip]') &&
          !contains(github.event.head_commit.message, '[skip cd]') &&
          !contains(github.event.head_commit.message, '[cd skip]')
        )
      }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
