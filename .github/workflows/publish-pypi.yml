name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to publish, for example v0.1.0"
        required: true
        type: string
      manifest_sha256:
        description: "Independently approved SHA-256 of qs-dmss-release-manifest.json"
        required: true
        type: string
      confirm:
        description: "Type publish-to-pypi to confirm publication"
        required: true
        type: string

permissions:
  contents: read

run-name: Publish ${{ inputs.tag }} to PyPI

jobs:
  prepare-release-assets:
    name: Validate release assets
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}

    steps:
      - name: Validate manual dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to publish: dispatch this workflow from main." >&2
            exit 1
          fi
          if [[ "$CONFIRM" != "publish-to-pypi" ]]; then
            echo "Refusing to publish: confirmation input must be publish-to-pypi." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish: tag must be a final release tag like v0.1.0." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Refusing to publish: supply the independently approved manifest SHA-256." >&2
            exit 1
          fi

      - name: Check out trusted verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Download GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication/dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir publication/dist \
            --pattern "*.whl" \
            --pattern "*.tar.gz"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir publication \
            --pattern "qs-dmss-release-manifest.json"

      - name: Verify downloaded release hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(git -C release-source rev-parse HEAD)
          python .github/scripts/verify_release_upload.py \
            --packet publication --tag "$RELEASE_TAG" --source-commit "$source_commit" \
            --manifest-sha256 "$RELEASE_MANIFEST_SHA256" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate release artifact metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import Parser
          from pathlib import Path
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          project = tomllib.loads(Path("release-source/pyproject.toml").read_text(encoding="utf-8"))
          package_name = project["project"]["name"]
          version = project["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(f"Tag {tag!r} does not match package version {expected_tag!r}.")

          dist = Path("publication/dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, got {wheels!r} and {sdists!r}.")

          expected_wheel = f"qs_dmss-{version}-py3-none-any.whl"
          expected_sdist = f"qs_dmss-{version}.tar.gz"
          if wheels[0].name != expected_wheel or sdists[0].name != expected_sdist:
              raise SystemExit(
                  f"Unexpected artifacts: {wheels[0].name}, {sdists[0].name}; "
                  f"expected {expected_wheel}, {expected_sdist}."
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(metadata_path).decode("utf-8"))
          if metadata["Name"].lower().replace("_", "-") != package_name:
              raise SystemExit(f"Wheel name mismatch: {metadata['Name']!r}.")
          if metadata["Version"] != version:
              raise SystemExit(f"Wheel version mismatch: {metadata['Version']!r}.")

          with tarfile.open(sdists[0]) as archive:
              names = set(archive.getnames())
          for required in (
              f"qs_dmss-{version}/README.md",
              f"qs_dmss-{version}/RELEASE.md",
              f"qs_dmss-{version}/pyproject.toml",
          ):
              if required not in names:
                  raise SystemExit(f"Sdist missing {required}.")

          print(f"Validated {package_name} {version} release artifacts from {tag}.")
          PY

      - name: Check release artifacts
        run: python -m twine check publication/dist/*

      - name: Upload PyPI-ready artifacts
        id: handoff
        uses: actions/upload-artifact@v7
        with:
          name: pypi-release-packet
          path: publication/
          if-no-files-found: error

  publish:
    name: Publish distributions
    runs-on: ubuntu-latest
    needs: prepare-release-assets
    environment:
      name: pypi
      url: https://pypi.org/project/qs-dmss/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve release tag again
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download PyPI-ready artifacts
        if: needs.prepare-release-assets.outputs.artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare-release-assets.outputs.artifact_id }}
          path: publication/

      - name: Verify approved hashes immediately before upload
        env:
          APPROVED_MANIFEST_SHA256: ${{ secrets.QS_DMSS_APPROVED_MANIFEST_SHA256 }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$APPROVED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ||
                "$APPROVED_MANIFEST_SHA256" != "$RELEASE_MANIFEST_SHA256" ]]; then
            echo "Refusing to publish: the protected pypi manifest approval is missing or does not match." >&2
            exit 1
          fi
          source_commit=$(git -C release-source rev-parse HEAD)
          python .github/scripts/verify_release_upload.py \
            --packet publication --tag "$RELEASE_TAG" --source-commit "$source_commit" \
            --manifest-sha256 "$APPROVED_MANIFEST_SHA256"

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publication/dist/
